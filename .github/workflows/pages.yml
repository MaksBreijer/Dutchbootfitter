# Publishes both previews on GitHub Pages, both marked noindex so they are never mistaken for the live sites:
#   /             -> DutchBootFitter (branch main, folder site/)
#   /strolz/      -> Strolz Amsterdam (branch strolz, repo root)
# The same file lives on both branches, so a push to either one republishes both.
name: Preview op GitHub Pages
on:
  push:
    branches: [main, strolz]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: dbf }
      - uses: actions/checkout@v4
        with: { ref: strolz, path: strolz }
      - name: Build both previews with noindex
        run: |
          mkdir -p _site/strolz
          cp -R dbf/site/. _site/
          cp strolz/*.html _site/strolz/
          cp -R strolz/assets _site/strolz/
          touch _site/.nojekyll
          find _site -name '*.html' -exec sed -i 's#<meta charset="utf-8">#<meta charset="utf-8">\n<meta name="robots" content="noindex, nofollow">#I' {} +
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Give GitHub a moment to register the upload
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
