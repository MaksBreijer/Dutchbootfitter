# Publishes the Strolz site (repo root) as a preview on GitHub Pages. The preview asks search
# engines not to index it.
name: Preview op GitHub Pages
on:
  push:
    branches: [strolz]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build preview folder with noindex
        run: |
          mkdir _site
          cp *.html _site/
          cp -R assets _site/
          touch _site/.nojekyll
          find _site -name '*.html' -exec sed -i 's#<meta charset="utf-8">#<meta charset="utf-8">\n<meta name="robots" content="noindex, nofollow">#I' {} +
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
